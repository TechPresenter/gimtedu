    <rect x="150" y="144" width="80" height="88" rx="10" fill="#FFFFFF"/>
    <rect x="159" y="153" width="62" height="70" rx="6" fill="none" stroke="#E7DED2" stroke-width="2"/>
    <rect x="246" y="226" width="80" height="18" rx="4" fill="#C7D3E9"/>
    <rect x="246" y="226" width="80" height="18" rx="4" fill="url(#cm-win)"/>
    <rect x="246" y="144" width="80" height="88" rx="10" fill="#FFFFFF"/>
    <rect x="255" y="153" width="62" height="70" rx="6" fill="none" stroke="#E7DED2" stroke-width="2"/>
    <rect x="342" y="226" width="88" height="18" rx="4" fill="#F6C9B6"/>
    <rect x="342" y="226" width="88" height="18" rx="4" fill="url(#cm-win-o)"/>
    <rect x="342" y="144" width="88" height="88" rx="10" fill="#FFFFFF"/>
    <rect x="351" y="153" width="70" height="70" rx="6" fill="none" stroke="#F3DCCF" stroke-width="2"/>
  </g>

  <!-- sports complex (north-east): track + field -->
  <rect x="748" y="138" width="304" height="128" rx="64" fill="#F37A52"/>
  <rect x="756" y="146" width="288" height="112" rx="56" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".7"/>
  <rect x="764" y="154" width="272" height="96" rx="48" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".7"/>
  <rect x="774" y="164" width="252" height="76" rx="38" fill="url(#cm-field)"/>
  <path d="M900 164V240" stroke="#FFFFFF" stroke-width="2" opacity=".85"/>
  <circle cx="900" cy="202" r="14" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".85"/>
  <!-- courts outside the ring road -->
  <rect x="1104" y="150" width="54" height="96" rx="6" fill="#8FB6DD"/>
  <rect x="1110" y="156" width="42" height="84" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M1110 198H1152" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="1104" y="262" width="54" height="96" rx="6" fill="#F3B48F"/>
  <rect x="1110" y="268" width="42" height="84" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M1110 310H1152" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- cafeteria (south-west) with outdoor seating -->
  <g filter="url(#cm-sh)">
    <rect x="230" y="620" width="152" height="16" rx="3" fill="url(#cm-awning)"/>
    <rect x="230" y="562" width="152" height="62" rx="12" fill="#FFFFFF"/>
    <rect x="240" y="571" width="132" height="44" rx="8" fill="none" stroke="#E7DED2" stroke-width="2"/>
  </g>
  <g fill="#FFFFFF" stroke="#E2D7C9" stroke-width="2">
    <circle cx="410" cy="580" r="10"/><circle cx="440" cy="600" r="10"/><circle cx="410" cy="616" r="10"/>
  </g>
  <g fill="#F05A28"><circle cx="410" cy="580" r="4"/><circle cx="440" cy="600" r="4"/><circle cx="410" cy="616" r="4"/></g>

  <!-- parking & transport bay (south-east) -->
  <rect x="796" y="552" width="238" height="80" rx="12" fill="#E8E0D5"/>
  <path d="M816 562V622M846 562V622M876 562V622M906 562V622M936 562V622" stroke="#FFFFFF" stroke-width="2"/>
  <g fill="#0B2A5B"><use href="#cm-car" x="831" y="592"/></g>
  <g fill="#F05A28"><use href="#cm-car" x="891" y="592"/></g>
  <g fill="#8FB6DD"><use href="#cm-car" x="921" y="592"/></g>
  <rect x="954" y="562" width="66" height="26" rx="6" fill="#FDD900"/>
  <path d="M962 570H1012" stroke="#0B2A5B" stroke-width="6" stroke-dasharray="7 4" opacity=".75"/>
  <rect x="954" y="596" width="66" height="26" rx="6" fill="#FDD900"/>
  <path d="M962 604H1012" stroke="#0B2A5B" stroke-width="6" stroke-dasharray="7 4" opacity=".75"/>

  <!-- green zones: tree belts -->
  <use href="#cm-tree" x="70" y="90"/><use href="#cm-tree-s" x="66" y="150"/><use href="#cm-tree" x="72" y="210"/><use href="#cm-tree-s" x="64" y="270"/>
  <use href="#cm-tree" x="70" y="330"/><use href="#cm-tree-s" x="66" y="390"/><use href="#cm-tree" x="72" y="450"/><use href="#cm-tree-s" x="64" y="510"/>
  <use href="#cm-tree" x="70" y="570"/><use href="#cm-tree-s" x="66" y="630"/><use href="#cm-tree" x="90" y="690"/>
  <use href="#cm-tree" x="200" y="60"/><use href="#cm-tree-s" x="260" y="58"/><use href="#cm-tree" x="320" y="62"/><use href="#cm-tree-s" x="380" y="58"/>
  <use href="#cm-tree" x="440" y="62"/><use href="#cm-tree-s" x="500" y="58"/><use href="#cm-tree" x="700" y="62"/><use href="#cm-tree-s" x="760" y="58"/>
  <use href="#cm-tree" x="820" y="62"/><use href="#cm-tree-s" x="880" y="58"/><use href="#cm-tree" x="940" y="62"/><use href="#cm-tree-s" x="1000" y="58"/>
  <use href="#cm-tree" x="160" y="690"/><use href="#cm-tree-s" x="220" y="700"/><use href="#cm-tree" x="290" y="692"/><use href="#cm-tree-s" x="360" y="700"/>
