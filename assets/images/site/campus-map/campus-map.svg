  <g filter="url(#cm-sh)">
    <rect x="198" y="376" width="204" height="20" rx="4" fill="#C7D3E9"/>
    <rect x="198" y="376" width="204" height="20" rx="4" fill="url(#cm-win)"/>
    <rect x="198" y="304" width="204" height="78" rx="12" fill="#FFFFFF"/>
    <rect x="208" y="313" width="184" height="60" rx="8" fill="none" stroke="#E7DED2" stroke-width="2"/>
    <rect x="232" y="324" width="44" height="38" rx="6" fill="#EEF2F9"/>
    <rect x="324" y="324" width="44" height="38" rx="6" fill="#EEF2F9"/>
  </g>
  <!-- academic block B -->
  <g filter="url(#cm-sh)">
    <rect x="198" y="496" width="204" height="20" rx="4" fill="#C7D3E9"/>
    <rect x="198" y="496" width="204" height="20" rx="4" fill="url(#cm-win)"/>
    <rect x="198" y="424" width="204" height="78" rx="12" fill="#FFFFFF"/>
    <rect x="208" y="433" width="184" height="60" rx="8" fill="none" stroke="#E7DED2" stroke-width="2"/>
    <rect x="232" y="444" width="136" height="38" rx="6" fill="#EEF2F9"/>
  </g>

