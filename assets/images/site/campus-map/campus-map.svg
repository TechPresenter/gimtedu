<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="cm-title cm-desc">
  <title id="cm-title">GIMT campus map</title>
  <desc id="cm-desc">Original illustrated campus map: main gate and main building at the bottom centre, academic blocks A and B on the west, the technology block on the east, the central library above the central lawn, hostels in the north-west, the sports complex in the north-east, the cafeteria and the parking and transport bay near the gate.</desc>
  <defs>
    <pattern id="cm-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E8DFD3" stroke-width="1"/></pattern>
    <pattern id="cm-win" width="16" height="18" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="8" height="9" rx="1.5" fill="#8DA2C6"/></pattern>
    <pattern id="cm-win-o" width="16" height="18" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="8" height="9" rx="1.5" fill="#E98A66"/></pattern>
    <pattern id="cm-solar" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#1F3F7A"/><path d="M0 0H12M0 0V12" stroke="#5C7BB5" stroke-width="1.2"/></pattern>
    <pattern id="cm-awning" width="16" height="14" patternUnits="userSpaceOnUse"><rect width="8" height="14" fill="#F05A28"/><rect x="8" width="8" height="14" fill="#FFF7F2"/></pattern>
    <linearGradient id="cm-lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8EBC8"/><stop offset="1" stop-color="#C3DEAE"/></linearGradient>
    <linearGradient id="cm-field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B4D99A"/><stop offset="1" stop-color="#9CCB80"/></linearGradient>
    <radialGradient id="cm-glow" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <filter id="cm-sh" x="-10%" y="-10%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#0B2A5B" flood-opacity=".14"/></filter>
    <g id="cm-tree"><ellipse cx="2" cy="11" rx="12" ry="5" fill="#0B2A5B" opacity=".08"/><circle r="12" fill="#7DB466"/><circle cx="3" cy="3" r="9" fill="#6AA455" opacity=".55"/><circle cx="-4" cy="-4" r="4.5" fill="#A5D38D"/></g>
    <g id="cm-tree-s"><ellipse cx="1" cy="8" rx="8" ry="3.5" fill="#0B2A5B" opacity=".08"/><circle r="8" fill="#8CC274"/><circle cx="-2.5" cy="-2.5" r="3" fill="#B1DB9B"/></g>
    <g id="cm-car"><rect x="-9" y="-15" width="18" height="30" rx="5"/><rect x="-6" y="-8" width="12" height="8" rx="2" fill="#FFFFFF" opacity=".7"/></g>
  </defs>

  <!-- ground -->
  <rect x="24" y="24" width="1152" height="712" rx="56" fill="#F4EFE8"/>
  <rect x="24" y="24" width="1152" height="712" rx="56" fill="url(#cm-grid)" opacity=".7"/>
  <rect x="24" y="24" width="1152" height="712" rx="56" fill="none" stroke="#E2D7C9" stroke-width="2"/>
  <ellipse cx="600" cy="380" rx="520" ry="320" fill="url(#cm-glow)"/>

  <!-- ring road -->
  <rect x="120" y="110" width="960" height="548" rx="64" fill="none" stroke="#E0D5C7" stroke-width="36"/>
  <rect x="120" y="110" width="960" height="548" rx="64" fill="none" stroke="#FFFFFF" stroke-width="30"/>
  <rect x="120" y="110" width="960" height="548" rx="64" fill="none" stroke="#E6DDD1" stroke-width="2" stroke-dasharray="12 14"/>

  <!-- main avenue from the gate + central axis walkways -->
  <rect x="574" y="658" width="52" height="82" fill="#E0D5C7"/>
  <rect x="577" y="658" width="46" height="82" fill="#FFFFFF"/>
  <path d="M600 676V744" stroke="#E6DDD1" stroke-width="2" stroke-dasharray="12 14"/>
  <path d="M600 548V300" stroke="#FBF8F3" stroke-width="22" stroke-linecap="round"/>
  <path d="M600 548V300" stroke="#E9E0D4" stroke-width="22" stroke-linecap="round" stroke-dasharray="1 0" opacity=".25"/>
  <path d="M410 440H790" stroke="#FBF8F3" stroke-width="18" stroke-linecap="round"/>
  <path d="M400 352H455M745 352H800" stroke="#FBF8F3" stroke-width="14" stroke-linecap="round"/>
  <path d="M300 240V306M300 380V426M600 160V200" stroke="#FBF8F3" stroke-width="12" stroke-linecap="round"/>

  <!-- central lawn -->
  <rect x="455" y="350" width="290" height="180" rx="44" fill="url(#cm-lawn)"/>
  <rect x="455" y="350" width="290" height="180" rx="44" fill="none" stroke="#B5D59F" stroke-width="2"/>
  <path d="M600 350V530M455 440H745" stroke="#F7F2EA" stroke-width="14"/>
  <circle cx="600" cy="440" r="30" fill="#FFFFFF"/>
  <circle cx="600" cy="440" r="24" fill="#CFE6F2"/>
  <circle cx="600" cy="440" r="11" fill="#9FCDE6"/>
  <circle cx="600" cy="440" r="4" fill="#FFFFFF"/>

  <!-- trees: lawn -->
  <use href="#cm-tree" x="490" y="382"/><use href="#cm-tree-s" x="525" y="404"/><use href="#cm-tree" x="700" y="384"/><use href="#cm-tree-s" x="672" y="408"/>
  <use href="#cm-tree" x="492" y="498"/><use href="#cm-tree-s" x="530" y="478"/><use href="#cm-tree" x="706" y="496"/><use href="#cm-tree-s" x="672" y="474"/>

  <!-- library (north of the lawn) -->
  <g filter="url(#cm-sh)">
    <rect x="512" y="296" width="176" height="20" rx="4" fill="#C7D3E9"/>
    <rect x="512" y="296" width="176" height="20" rx="4" fill="url(#cm-win)"/>
    <rect x="512" y="198" width="176" height="104" rx="14" fill="#FFFFFF"/>
    <rect x="522" y="208" width="156" height="84" rx="9" fill="none" stroke="#E7DED2" stroke-width="2"/>
    <circle cx="600" cy="250" r="32" fill="#FDE4DA"/>
    <circle cx="600" cy="250" r="32" fill="none" stroke="#F37A52" stroke-width="3"/>
    <circle cx="600" cy="250" r="18" fill="#FAC6B2"/>
    <path d="M600 232V268M582 250H618" stroke="#F37A52" stroke-width="2" opacity=".6"/>
  </g>

  <!-- main building + auditorium drum (bottom centre) -->
  <g filter="url(#cm-sh)">
    <ellipse cx="600" cy="546" rx="74" ry="32" fill="#FAC6B2"/>
    <ellipse cx="600" cy="544" rx="58" ry="23" fill="#FDE4DA"/>
    <path d="M552 546Q600 516 648 546" fill="none" stroke="#F37A52" stroke-width="2" opacity=".55"/>
    <rect x="482" y="606" width="236" height="20" rx="4" fill="#C7D3E9"/>
    <rect x="482" y="606" width="236" height="20" rx="4" fill="url(#cm-win)"/>
    <rect x="482" y="552" width="236" height="60" rx="12" fill="#FFFFFF"/>
    <rect x="492" y="561" width="216" height="42" rx="8" fill="none" stroke="#E7DED2" stroke-width="2"/>
    <rect x="572" y="600" width="56" height="26" rx="5" fill="#0B2A5B"/>
    <rect x="580" y="606" width="40" height="20" rx="3" fill="#1F4A94"/>
  </g>
  <!-- flag + forecourt -->
  <path d="M672 696V732" stroke="#0B2A5B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M673 696H692L686 703L692 710H673Z" fill="#F05A28"/>

  <!-- main gate -->
  <rect x="554" y="704" width="14" height="30" rx="3" fill="#0B2A5B"/>
  <rect x="632" y="704" width="14" height="30" rx="3" fill="#0B2A5B"/>
  <path d="M561 706Q600 680 639 706" fill="none" stroke="#0B2A5B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="692" r="5" fill="#F05A28"/>

