    <circle r="24" fill="#FFFFFF" stroke="#E2D7C9" stroke-width="2"/>
    <path d="M0 -16L6 4L0 0L-6 4Z" fill="#F05A28"/>
    <path d="M0 16L6 -4L0 0L-6 -4Z" fill="#0B2A5B" opacity=".35"/>
    <path d="M-4.5 -28.5V-37.5L4.5 -28.5V-37.5" fill="none" stroke="#0B2A5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
