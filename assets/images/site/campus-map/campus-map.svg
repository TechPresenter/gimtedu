  <use href="#cm-tree" x="1130" y="420"/><use href="#cm-tree-s" x="1134" y="480"/><use href="#cm-tree" x="1130" y="540"/><use href="#cm-tree-s" x="1134" y="600"/>
  <use href="#cm-tree" x="1110" y="676"/>
  <!-- inner groves -->
  <use href="#cm-tree" x="176" y="270"/><use href="#cm-tree-s" x="450" y="170"/><use href="#cm-tree" x="474" y="236"/><use href="#cm-tree-s" x="726" y="232"/>
  <use href="#cm-tree" x="712" y="174"/><use href="#cm-tree-s" x="176" y="556"/><use href="#cm-tree" x="176" y="600"/><use href="#cm-tree-s" x="440" y="532"/>
